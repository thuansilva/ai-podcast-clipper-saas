[pytest]
# Restringe a descoberta de testes à pasta tests/. Sem isso, o pytest tenta
# coletar asd/Columbia_test.py (script vendored do submódulo LR-ASD, não é
# um teste) porque o nome bate com o padrão *_test.py, e falha ao importar
# por depender de `torch`, que não está instalado no job leve de CI.
testpaths = tests
markers =
    minio: integration test against a real MinIO server (S3-compatible). Skipped with a clear message when the server is unreachable. See tests/minio_support.py.
