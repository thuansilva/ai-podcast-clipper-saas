receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Promove service.name (atributo de resource) a label do Loki, para dar
  # pra filtrar/correlacionar logs por serviço no Grafana.
  attributes/loki:
    actions:
      - action: insert
        key: loki.resource.labels
        value: service.name

connectors:
  # Deriva métricas RED (rate/errors/duration) diretamente dos spans que já
  # fluem pela pipeline de traces, sem precisar adicionar um MeterProvider em
  # cada aplicação instrumentada. Gera, por serviço/operação:
  #   traces_spanmetrics_calls_total{...}   -> contador de chamadas (rate/erros)
  #   traces_spanmetrics_duration_{bucket,sum,count} -> histograma de latência
  spanmetrics:
    namespace: traces.spanmetrics
    histogram:
      explicit:
        buckets: [10ms, 50ms, 100ms, 200ms, 400ms, 800ms, 1s, 1.5s, 2s, 5s, 10s]
    dimensions:
      - name: http.method
      - name: http.status_code
      - name: http.route
    exemplars:
      enabled: true
    metrics_flush_interval: 15s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      # Recebe tanto métricas OTLP eventualmente emitidas por uma app (hoje
      # nenhuma emite) quanto as métricas RED derivadas dos spans pelo
      # conector spanmetrics.
      receivers: [otlp, spanmetrics]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch, attributes/loki]
      exporters: [loki]
    traces:
      receivers: [otlp]
      processors: [batch]
      # O conector spanmetrics também atua como "exporter" desta pipeline:
      # cada span processado alimenta os contadores/histogramas de métricas.
      exporters: [otlp/tempo, spanmetrics]

  telemetry:
    logs:
      level: info
