services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-podcast-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_podcast_clipper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_podcast_clipper"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO — alternativa self-hosted e gratuita ao AWS S3 real, usada em dev
  # local (Fase 1c do plano de "MinIO como alternativa ao S3 real"). Evita
  # custo de S3 real durante desenvolvimento/testes; apontar a aplicação
  # (frontend/backend) para aqui em vez do AWS S3 real é feito só via env
  # var (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/endpoint customizado — ver
  # valores do usuário restrito no serviço `minio-init` abaixo), fora do
  # escopo desta tarefa.
  #
  # Imagem: a imagem oficial `minio/minio` (Docker Hub) e o mirror
  # `quay.io/minio/minio` deixaram de estar disponíveis de graça —
  # confirmado em 2026-10-10 via `docker pull`/`docker manifest inspect`
  # (minio/minio:<tag> retorna "pull access denied"/"unauthorized";
  # quay.io/minio/minio:<tag> retorna "no such manifest"/MANIFEST_UNKNOWN —
  # erros diferentes, mesmo resultado prático: nenhum dos dois serve a
  # imagem gratuitamente). A MinIO, Inc. descontinuou a distribuição
  # gratuita de imagens de container da Community Edition nesses
  # registries. Usamos em vez disso o build comunitário gratuito publicado
  # pela Chainguard (https://images.chainguard.dev/directory/image/minio/),
  # que empacota os binários oficiais `minio` E `mc` num único image
  # Wolfi — por isso o MESMO image é reaproveitado no `minio-init` abaixo em
  # vez de `minio/mc`, que também não está mais disponível gratuitamente. O
  # plano gratuito da Chainguard só publica a tag rolante `latest` (tags
  # datadas, tipo `minio:2026-09-22`, exigem assinatura paga) — para não
  # depender de uma tag mutável, fixamos pelo digest sha256 exato (imutável,
  # efeito equivalente a uma tag fixa de versão). Versão do MinIO
  # empacotada neste digest específico (confirmada rodando `minio
  # --version` dentro da imagem): RELEASE.2026-09-22T19-25-18Z.
  minio:
    image: cgr.dev/chainguard/minio@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf
    container_name: ai-podcast-minio
    restart: always
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # Credenciais de ROOT — só para bootstrap/administração (usadas pelo
      # `minio-init` abaixo para criar o bucket e o usuário restrito do
      # projeto). A aplicação NUNCA deve usar estas credenciais — ver
      # usuário restrito (MINIO_APP_ACCESS_KEY/MINIO_APP_SECRET_KEY) no
      # `minio-init`. Default não-sensível de dev local, mesmo padrão já
      # usado pro Postgres acima (POSTGRES_PASSWORD).
      # ATENÇÃO — SÓ DEV LOCAL, NUNCA EM PRODUÇÃO: estes defaults
      # (`minioadmin`/`minioadmin`) são públicos (documentação oficial do
      # MinIO). Um MinIO de produção exige credenciais root fortes e únicas,
      # injetadas via secret manager, nunca estes valores.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # CORS: o frontend faz upload direto do browser via URL pré-assinada
      # (PUT) — sem isso, o browser bloqueia a resposta. Validado manualmente
      # com um PUT real via URL pré-assinada (boto3) + header
      # "Origin: http://localhost:3000": resposta 200 com
      # "Access-Control-Allow-Origin: http://localhost:3000"; com uma origem
      # diferente, o header de CORS não é mais refletido (bloqueado pelo
      # browser), confirmando que a config restringe de fato à origem
      # configurada (sem ela, esta versão do MinIO reflete QUALQUER origin
      # por padrão).
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3000}
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console web
    volumes:
      - minio_data:/data
    healthcheck:
      # A imagem Chainguard não tem curl/wget (base Wolfi minimalista) nem
      # grep — por isso a checagem usa só recursos internos do bash (nesta
      # imagem, /bin/sh é um symlink para /usr/bin/bash): abre um socket TCP
      # cru via /dev/tcp, manda a requisição HTTP à mão e confere "200" na
      # linha de status.
      test: ["CMD-SHELL", 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r line <&3 && [[ "$$line" == *200* ]]']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Container one-shot: cria o bucket do projeto e um usuário/credenciais
  # RESTRITOS (política só de leitura/escrita/delete nesse bucket
  # específico) para a aplicação usar — nunca o usuário root do MinIO.
  # Idempotente: reexecutar (`docker compose up -d minio minio-init`) não
  # falha nem duplica nada (confirmado rodando o script duas vezes em
  # sequência).
  #
  # Regra de ciclo de vida (ILM, expiração de uploads/ e youtube/ em 1 dia —
  # ver docs/operacao/aws-s3-lifecycle-rules.md) propositalmente NÃO
  # automatizada aqui: `mc ilm rule add` não é idempotente (cada execução
  # cria uma regra nova com ID novo, duplicando a regra a cada
  # `docker compose up`), e tornar isso idempotente exigiria checar as
  # regras já existentes via `mc ilm rule ls --json` e parsear o resultado —
  # complexidade desproporcional para um container one-shot de dev. Quem
  # precisar dessa regra em dev local pode rodar manualmente uma vez:
  # `docker compose exec minio-init mc ilm rule add --expire-days 1 --prefix "uploads/" local/ai-podcast-clipper`
  # (e o mesmo para "youtube/").
  #
  # Valores que o frontend/backend devem usar para apontar pro MinIO LOCAL
  # em vez do AWS S3 real. ATENÇÃO — SÓ DEV LOCAL, NUNCA EM PRODUÇÃO: as
  # credenciais default abaixo são fixas, determinísticas e estão
  # versionadas neste arquivo (portanto públicas). Em produção (AWS S3 real
  # ou um MinIO self-hosted), use credenciais próprias via secret manager e
  # um S3_ENDPOINT_URL público com https:// — o frontend recusa endpoint
  # localhost/privado/http em NODE_ENV=production (ver
  # ai-podcast-clipper-frontend/src/infrastructure/storage/storage-endpoint-guard.ts).
  #   AWS_ACCESS_KEY_ID     = valor de MINIO_APP_ACCESS_KEY abaixo (default: ai-podcast-clipper-app)
  #   AWS_SECRET_ACCESS_KEY = valor de MINIO_APP_SECRET_KEY abaixo (default: ai-podcast-clipper-app-secret123)
  #   S3_BUCKET_NAME        = ai-podcast-clipper (mesmo default já usado em
  #                           ai-podcast-clipper-backend/main.py:75 e
  #                           local_server.py:132/141)
  #   AWS_REGION            = us-east-1 (MinIO aceita qualquer valor; mantido
  #                           igual ao default já usado em
  #                           scripts/test-everything.sh e nos .env.example)
  #   endpoint customizado  = http://localhost:9000 (do host) ou
  #                           http://minio:9000 (de outro container nesta
  #                           mesma rede do compose)
  minio-init:
    image: cgr.dev/chainguard/minio@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf
    container_name: ai-podcast-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_APP_BUCKET: ${MINIO_APP_BUCKET:-ai-podcast-clipper}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-ai-podcast-clipper-app}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-ai-podcast-clipper-app-secret123}
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_APP_BUCKET"
        mc admin user add local "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY"
        policy_json="{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:*\"],\"Resource\":[\"arn:aws:s3:::$${MINIO_APP_BUCKET}\",\"arn:aws:s3:::$${MINIO_APP_BUCKET}/*\"]}]}"
        printf '%s' "$$policy_json" > /tmp/policy.json
        mc admin policy create local ai-podcast-clipper-rw /tmp/policy.json
        mc admin policy attach local ai-podcast-clipper-rw --user "$$MINIO_APP_ACCESS_KEY"
        echo "minio-init concluido: bucket=$$MINIO_APP_BUCKET usuario=$$MINIO_APP_ACCESS_KEY"
    restart: "no"

  k6:
    image: grafana/k6:latest
    container_name: ai-podcast-k6
    network_mode: host
    volumes:
      - ./ai-podcast-clipper-frontend:/work
    working_dir: /work

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: ai-podcast-otel-collector
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # métricas expostas para o Prometheus fazer scrape
    depends_on:
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ai-podcast-prometheus
    restart: always
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  loki:
    image: grafana/loki:2.9.6
    container_name: ai-podcast-loki
    restart: always
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.5.0
    container_name: ai-podcast-tempo
    restart: always
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ai-podcast-grafana
    restart: always
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  backend-stub:
    build:
      context: .
      dockerfile: backend-stub/Dockerfile
    container_name: ai-podcast-backend-stub
    restart: always
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: ai-podcast-clipper-backend-stub
      # Simula o backend "GPU" localmente: latência aleatória entre min/max
      # (ms) e uma fração das requisições falhando de propósito, pra testar
      # trace/log de erro sem precisar do Modal real.
      # Parametrizado via env var do host (com default = comportamento normal)
      # para o cenário "latencia_alta" de
      # scripts/experimento-observabilidade.sh poder elevar a latência com
      # `STUB_LATENCY_MS_MIN=... STUB_LATENCY_MS_MAX=... docker compose up -d
      # --force-recreate backend-stub`, sem precisar editar este arquivo.
      STUB_LATENCY_MS_MIN: "${STUB_LATENCY_MS_MIN:-200}"
      STUB_LATENCY_MS_MAX: "${STUB_LATENCY_MS_MAX:-1500}"
      STUB_ERROR_RATE: "0"
    ports:
      - "8001:8000"
    depends_on:
      - otel-collector

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: ai-podcast-blackbox-exporter
    restart: always
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"
    depends_on:
      - backend-stub

  # Métricas de host (CPU, memória, disco, rede) pro dashboard oficial
  # "Node Exporter Full" (grafana.com/grafana/dashboards/1860-node-exporter-full/).
  # Monta /proc, /sys e / (como /rootfs) somente leitura, conforme a doc oficial
  # do node_exporter. Em WSL2 isso reflete a VM do WSL, não o hardware real do
  # host Windows — suficiente pro experimento local.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: ai-podcast-node-exporter
    restart: always
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"

  # Métricas por container Docker pro dashboard oficial de cAdvisor
  # (grafana.com/grafana/dashboards/21743-cadvisor-exporter-docker-containers-overview/).
  # Mounts conforme README oficial do cAdvisor (google/cadvisor): /var/run, /sys,
  # /var/lib/docker e /dev/disk, todos somente leitura. `--privileged` e acesso a
  # /dev/kmsg são necessários pra leitura completa de métricas de cgroup/kernel.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: ai-podcast-cadvisor
    restart: always
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8081:8080"

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
