services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-podcast-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_podcast_clipper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_podcast_clipper"]
      interval: 5s
      timeout: 5s
      retries: 5

  k6:
    image: grafana/k6:latest
    container_name: ai-podcast-k6
    network_mode: host
    volumes:
      - ./ai-podcast-clipper-frontend:/work
    working_dir: /work

volumes:
  postgres_data:
