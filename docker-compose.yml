services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-podcast-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_podcast_clipper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_podcast_clipper"]
      interval: 5s
      timeout: 5s
      retries: 5

  k6:
    image: grafana/k6:latest
    container_name: ai-podcast-k6
    network_mode: host
    volumes:
      - ./ai-podcast-clipper-frontend:/work
    working_dir: /work

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: ai-podcast-otel-collector
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # métricas expostas para o Prometheus fazer scrape
    depends_on:
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ai-podcast-prometheus
    restart: always
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  loki:
    image: grafana/loki:2.9.6
    container_name: ai-podcast-loki
    restart: always
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.5.0
    container_name: ai-podcast-tempo
    restart: always
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ai-podcast-grafana
    restart: always
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  backend-stub:
    build:
      context: .
      dockerfile: backend-stub/Dockerfile
    container_name: ai-podcast-backend-stub
    restart: always
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: ai-podcast-clipper-backend-stub
      # Simula o backend "GPU" localmente: latência aleatória entre min/max
      # (ms) e uma fração das requisições falhando de propósito, pra testar
      # trace/log de erro sem precisar do Modal real.
      # Parametrizado via env var do host (com default = comportamento normal)
      # para o cenário "latencia_alta" de
      # scripts/experimento-observabilidade.sh poder elevar a latência com
      # `STUB_LATENCY_MS_MIN=... STUB_LATENCY_MS_MAX=... docker compose up -d
      # --force-recreate backend-stub`, sem precisar editar este arquivo.
      STUB_LATENCY_MS_MIN: "${STUB_LATENCY_MS_MIN:-200}"
      STUB_LATENCY_MS_MAX: "${STUB_LATENCY_MS_MAX:-1500}"
      STUB_ERROR_RATE: "0"
    ports:
      - "8001:8000"
    depends_on:
      - otel-collector

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: ai-podcast-blackbox-exporter
    restart: always
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"
    depends_on:
      - backend-stub

  # Métricas de host (CPU, memória, disco, rede) pro dashboard oficial
  # "Node Exporter Full" (grafana.com/grafana/dashboards/1860-node-exporter-full/).
  # Monta /proc, /sys e / (como /rootfs) somente leitura, conforme a doc oficial
  # do node_exporter. Em WSL2 isso reflete a VM do WSL, não o hardware real do
  # host Windows — suficiente pro experimento local.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: ai-podcast-node-exporter
    restart: always
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"

  # Métricas por container Docker pro dashboard oficial de cAdvisor
  # (grafana.com/grafana/dashboards/21743-cadvisor-exporter-docker-containers-overview/).
  # Mounts conforme README oficial do cAdvisor (google/cadvisor): /var/run, /sys,
  # /var/lib/docker e /dev/disk, todos somente leitura. `--privileged` e acesso a
  # /dev/kmsg são necessários pra leitura completa de métricas de cgroup/kernel.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: ai-podcast-cadvisor
    restart: always
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "8081:8080"

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
